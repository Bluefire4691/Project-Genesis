[project]
name = "genesis-v2"
version = "0.1.0.dev0"
description = "A local, always-on learning agent. Portable by construction."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["torch>=2.4", "lightgbm>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: eval-suite tests that need a live model (excluded from CI)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
